<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Atlatl - Play</title>
  <link rel="stylesheet" href="layout.css"/>
  <script type="module">
    import {Play} from "./play.js";
    window.init = Play.init;
    window.bluePressed = Play.bluePressed;
    window.redPressed = Play.redPressed;
    window.endMovePressed = Play.endMovePressed;
    window.sendReset = Play.sendReset;
    window.sendNextGame = Play.sendNextGame;
  </script>
</head>

<body onload="init()">
  <div id="top-bar">
    <span>Role request:</span>
    <input id="blue" type="button" value="Blue" onclick="bluePressed(this);" disabled/>
    <input id="red" type="button" value="Red" onclick="redPressed(this);" disabled/>
    &nbsp;|&nbsp;
    <span>OnMove: <strong id="onmove">None</strong></span>
    &nbsp;
    <span>Phase: <strong id="phase">None</strong></span>
    <input id="end-move" type="button" value="End Phase" onclick="endMovePressed();" disabled/>
    &nbsp;|&nbsp;
    <span>Score: <strong id="score">None</strong></span>
    <input id="reset" type="button" value="Reset" onclick="sendReset();" disabled/>
    <input id="next-game" type="button" value="Next Game" onclick="sendNextGame();" disabled/>
    &nbsp;|&nbsp;
    <span>Status: <span id="status">Not connected</span></span>

    <div class="view-controls">
      <input id="toggle-fit" type="button" value="🔎 Full View (Scroll)" onclick="toggleFitScreen();" title="Toggle between fitting whole map on screen and scrollable full size"/>
      <input id="zoom-out" type="button" value="➖" onclick="zoomOut();" title="Zoom Out"/>
      <span id="zoom-level">Fit</span>
      <input id="zoom-in" type="button" value="➕" onclick="zoomIn();" title="Zoom In"/>
    </div>
  </div>

  <div id="map-container" class="fit-mode"></div>
</body>
</html>
