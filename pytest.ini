[pytest]
testpaths = tests/test_scenario_loading.py tests/server_unit
python_files = test_*.py
pythonpath = .
addopts = --import-mode=importlib --strict-config --strict-markers -ra --basetemp=tests/.tmp/pytest --output=tests/.artifacts/playwright --tracing=retain-on-failure --screenshot=only-on-failure
required_plugins = pytest-asyncio pytest-playwright pytest-cov
xfail_strict = true
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
cache_dir = tests/.cache/pytest
markers =
    core: lightweight engine and harness regression suite
    protocol: message transport and protocol behavior
    browser: tests requiring a real browser
    ml: optional ML and reinforcement learning dependencies
    scripts: isolated executable examples and utilities
    unit: isolated operation with controlled collaborators
    integration: cooperating modules or real external boundaries
    slow: explicitly selected expensive checks
